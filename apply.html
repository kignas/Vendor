<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#E4572E"><title>Become an Eatswada Vendor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#1A1D29;--muted:#667085;--paper:#F2F3F6;--card:#fff;--line:#E3E5EA;--primary:#E4572E;--primary-dark:#C43F1B;--success:#2F6F4E}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}main{max-width:760px;margin:0 auto;padding:28px 16px 56px}.brand{margin-bottom:22px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--muted);font-weight:600}.brand h1{font-family:Poppins;margin:5px 0;font-size:28px}.brand p{color:var(--muted);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(26,29,41,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.field.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:92px;resize:vertical}input:focus,textarea:focus{outline:2px solid rgba(228,87,46,.2);border-color:var(--primary)}.hint{font-size:11px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--primary);color:#fff}.primary:disabled{opacity:.6;cursor:wait}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.message{display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.45}.message.show{display:block}.message.error{background:#f8e8e8;color:#8b3030}.message.success{background:#e7f1eb;color:#245a3f}.result{margin-top:18px;padding:16px;background:#f7f8fa;border-radius:12px;display:none}.result.show{display:block}.mono{font-family:monospace;word-break:break-all}.links{margin-top:16px;font-size:13px;color:var(--muted)}.links a{color:var(--primary-dark);font-weight:600;margin-right:14px}@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.brand h1{font-size:24px}}
</style></head><body><main><div class="brand"><div class="eyebrow">Eatswada Partner</div><h1>Become a vendor</h1><p>Submit your restaurant for admin review. Your restaurant goes live only after approval.</p></div><section class="card"><form id="form"><div class="grid"><div class="field"><label for="ownerName">Owner name *</label><input id="ownerName" maxlength="120" required></div><div class="field"><label for="restaurantName">Restaurant name *</label><input id="restaurantName" maxlength="160" required></div><div class="field"><label for="email">Email *</label><input id="email" type="email" required></div><div class="field"><label for="phone">Phone *</label><input id="phone" inputmode="tel" placeholder="+919876543210" required></div><div class="field"><label for="password">Password *</label><input id="password" type="password" minlength="10" required><div class="hint">At least 10 characters.</div></div><div class="field"><label for="cuisine">Cuisine *</label><input id="cuisine" placeholder="Biryani, Indian" required></div><div class="field full"><label for="address">Restaurant address</label><input id="address" maxlength="500"></div><div class="field full"><label for="description">Description</label><textarea id="description" maxlength="1000" placeholder="Short description of your restaurant"></textarea></div><div class="field"><label for="longitude">Longitude</label><input id="longitude" inputmode="decimal" placeholder="Optional"></div><div class="field"><label for="latitude">Latitude</label><input id="latitude" inputmode="decimal" placeholder="Optional"></div></div><div class="actions"><button class="btn primary" id="submit" type="submit">Submit application</button><a class="btn ghost" href="application-status.html">Check application status</a></div><div class="message" id="message"></div><div class="result" id="result"></div></form></section><div class="links"><a href="login.html">Vendor login</a><a href="application-status.html">Application status</a></div></main><script>
const API='https://eatswada.onrender.com/api/vendor-applications';const form=document.getElementById('form'),msg=document.getElementById('message'),result=document.getElementById('result'),btn=document.getElementById('submit');const v=id=>document.getElementById(id).value.trim();function show(text,type){msg.textContent=text;msg.className='message show '+type}form.addEventListener('submit',async e=>{e.preventDefault();result.className='result';if(v('password').length<10)return show('Password must be at least 10 characters.','error');let location;const lon=v('longitude'),lat=v('latitude');if(lon!==''||lat!==''){const x=Number(lon),y=Number(lat);if(!Number.isFinite(x)||!Number.isFinite(y)||x<-180||x>180||y<-90||y>90)return show('Enter valid coordinates or leave both fields empty.','error');location={type:'Point',coordinates:[x,y]}}btn.disabled=true;show('Submitting application…','success');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({ownerName:v('ownerName'),email:v('email'),phone:v('phone'),password:v('password'),restaurantName:v('restaurantName'),cuisine:v('cuisine'),description:v('description'),address:v('address'),...(location?{location}:{})})});const j=await r.json().catch(()=>null);if(!r.ok||!j?.success)throw new Error(j?.message||'Could not submit the application.');const a=j.data;sessionStorage.setItem('eatswada_vendor_application_id',a.id);sessionStorage.setItem('eatswada_vendor_application_status_token',a.statusToken);result.innerHTML='<strong>Application submitted.</strong><div style="margin-top:7px">Application ID: <span class="mono">'+a.id+'</span></div><div style="margin-top:7px;color:#667085">Save this browser session or use the status page on this device to check progress.</div>';result.className='result show';form.reset();show('Your application is pending admin review.','success')}catch(err){show(err.message||'Could not submit the application. Please try again later.','error')}finally{btn.disabled=false}});
</script></body></html>
