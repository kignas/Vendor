<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders · Nearbite Vendor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     1. DESIGN TOKENS
     ============================================================ */
  :root{
    --ink:        #1A1D29;
    --ink-soft:   #5B5F72;
    --paper:      #F2F3F6;
    --card:       #FFFFFF;
    --line:       #E3E5EA;

    --flame:      #E4572E;  /* new order / primary action   */
    --flame-dark: #C43F1B;
    --flame-soft: #FBE7E0;

    --basil:      #2F6F4E;  /* accept / confirmed / delivered */
    --basil-soft: #E3F0E8;

    --turmeric:      #C97A11; /* preparing / in progress */
    --turmeric-soft: #FBEED9;

    --rust:       #9C3B3B;  /* reject / cancelled */
    --rust-soft:  #F5E6E6;

    --font-display: 'Poppins', sans-serif;
    --font-body:    'IBM Plex Sans', sans-serif;
    --font-mono:    'IBM Plex Mono', monospace;

    --radius: 10px;
    --shadow: 0 1px 2px rgba(26,29,41,0.04), 0 4px 16px rgba(26,29,41,0.06);
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  button{ font-family: inherit; }

  :focus-visible{
    outline: 2px solid var(--flame);
    outline-offset: 2px;
  }

  /* ============================================================
     2. APP SHELL / TOP BAR
     ============================================================ */
  .app-shell{
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 16px 48px;
  }

  .topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 2px 16px;
  }

  .brand{ display: flex; flex-direction: column; }
  .brand-eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .brand h1{
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    margin: 2px 0 0;
  }

  .status-toggle{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow);
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
  }
  .status-toggle .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ink-soft);
    transition: background 0.15s ease;
  }
  .status-toggle.open .dot{ background: var(--basil); }
  .status-toggle.closed .dot{ background: var(--rust); }
  .status-toggle:disabled, .status-toggle.busy{ opacity: 0.6; cursor: wait; }

  /* ============================================================
     3. TAB RAIL
     ============================================================ */
  .tab-rail{
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 18px;
    scrollbar-width: none;
  }
  .tab-rail::-webkit-scrollbar{ display: none; }

  .tab{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .tab[aria-selected="true"]{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .tab .count{
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--flame-soft);
    color: var(--flame-dark);
  }
  .tab[aria-selected="true"] .count{
    background: rgba(255,255,255,0.18);
    color: #fff;
  }

  .toolbar-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .refresh-btn{
    display: flex; align-items: center; gap: 6px;
    background: none; border: none;
    color: var(--ink-soft);
    font-size: 12px;
    cursor: pointer;
    padding: 4px;
  }
  .refresh-btn svg{ width: 13px; height: 13px; }
  .refresh-btn:hover{ color: var(--ink); }

  /* ============================================================
     4. TICKET RAIL + TICKET CARD (signature element)
     ============================================================ */
  .ticket-rail{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
    gap: 14px;
  }

  .ticket{
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ink-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 14px 12px;
    animation: ticket-in 0.25s ease;
  }
  @keyframes ticket-in{
    from{ opacity: 0; transform: translateY(4px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .ticket{ animation: none; }
  }

  .ticket.status-placed{ border-left-color: var(--flame); }
  .ticket.status-confirmed,
  .ticket.status-preparing{ border-left-color: var(--turmeric); }
  .ticket.status-out_for_delivery{ border-left-color: var(--ink-soft); }
  .ticket.status-delivered{ border-left-color: var(--basil); }
  .ticket.status-cancelled{ border-left-color: var(--rust); }

  .ticket-head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 9px;
    margin-bottom: 9px;
    border-bottom: 1px dashed var(--line);
  }
  .ticket-no{
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .ticket-time{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .ticket-items{
    list-style: none;
    margin: 0 0 10px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ticket-items li{
    display: flex;
    gap: 6px;
    font-size: 13px;
    line-height: 1.4;
  }
  .ticket-items .qty{
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--ink-soft);
    flex: 0 0 auto;
  }
  .ticket-items .more{
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .ticket-foot{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 9px;
    border-top: 1px dashed var(--line);
  }
  .ticket-total{
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 14px;
  }

  .ticket-actions{ display: flex; gap: 8px; }

  .btn{
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity: 0.55; cursor: wait; transform: none; }

  .btn.accept{ background: var(--basil); color: #fff; }
  .btn.reject{ background: var(--rust-soft); color: var(--rust); }
  .btn.advance{ background: var(--turmeric); color: #fff; }
  .btn.ghost{ background: var(--paper); color: var(--ink); }
  .btn.danger{ background: var(--rust); color: #fff; }

  .badge{
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .badge.dispatch{ background: var(--paper); color: var(--ink-soft); }
  .badge.delivered{ background: var(--basil-soft); color: var(--basil); }
  .badge.cancelled{ background: var(--rust-soft); color: var(--rust); }

  .ticket-note{
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
  }

  /* ============================================================
     5. SKELETON LOADER
     ============================================================ */
  .skeleton-ticket{
    height: 168px;
    border-radius: var(--radius);
    background: linear-gradient(100deg, #EDEEF1 30%, #F6F7F9 50%, #EDEEF1 70%);
    background-size: 200% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer{
    from{ background-position: 200% 0; }
    to{ background-position: -200% 0; }
  }
  @media (prefers-reduced-motion: reduce){
    .skeleton-ticket{ animation: none; background: #EDEEF1; }
  }

  /* ============================================================
     6. EMPTY / ERROR STATES
     ============================================================ */
  .state-panel{
    grid-column: 1 / -1;
    text-align: center;
    padding: 56px 20px;
    color: var(--ink-soft);
  }
  .state-panel svg{ width: 34px; height: 34px; margin-bottom: 10px; opacity: 0.5; }
  .state-panel h3{
    font-family: var(--font-display);
    color: var(--ink);
    font-size: 15px;
    margin: 0 0 4px;
  }
  .state-panel p{ font-size: 13px; margin: 0; max-width: 320px; margin-inline: auto; }

  /* ============================================================
     7. TOASTS
     ============================================================ */
  .toast-stack{
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
    z-index: 100;
    width: min(92vw, 380px);
  }
  .toast{
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--ink);
    color: #fff;
    padding: 12px 14px;
    border-radius: 9px;
    font-size: 13px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--basil);
    animation: toast-in 0.2s ease;
  }
  .toast.error{ border-left-color: var(--rust); }
  .toast.info{ border-left-color: var(--turmeric); }
  @keyframes toast-in{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){ .toast{ animation: none; } }

  /* ============================================================
     8. REJECT MODAL
     ============================================================ */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(26,29,41,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 200;
  }
  .modal-overlay.open{ display: flex; }
  .modal{
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    width: min(100%, 380px);
    box-shadow: var(--shadow);
  }
  .modal h3{
    font-family: var(--font-display);
    margin: 0 0 4px;
    font-size: 16px;
  }
  .modal p{ font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }
  .modal textarea{
    width: 100%;
    min-height: 74px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    margin-bottom: 14px;
  }
  .modal-actions{ display: flex; justify-content: flex-end; gap: 8px; }

</style>
</head>
<body>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-eyebrow">Nearbite Vendor</span>
        <h1 id="restaurantName">Loading restaurant…</h1>
      </div>
      <button class="status-toggle" id="statusToggle" type="button" disabled>
        <span class="dot"></span>
        <span class="label">—</span>
      </button>
    </header>

    <nav class="tab-rail" role="tablist" aria-label="Order stages">
      <button class="tab" role="tab" data-tab="new" aria-selected="true">
        New <span class="count" id="countNew">0</span>
      </button>
      <button class="tab" role="tab" data-tab="preparing" aria-selected="false">
        Preparing <span class="count" id="countPreparing">0</span>
      </button>
      <button class="tab" role="tab" data-tab="dispatch" aria-selected="false">
        Out for delivery <span class="count" id="countDispatch">0</span>
      </button>
      <button class="tab" role="tab" data-tab="history" aria-selected="false">
        History
      </button>
    </nav>

    <div class="toolbar-row">
      <span id="lastUpdated">Loading…</span>
      <button class="refresh-btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/>
        </svg>
        Refresh
      </button>
    </div>

    <main class="ticket-rail" id="ticketRail" aria-live="polite">
      <div class="skeleton-ticket"></div>
      <div class="skeleton-ticket"></div>
      <div class="skeleton-ticket"></div>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <div class="modal-overlay" id="rejectModal">
    <div class="modal">
      <h3>Reject this order</h3>
      <p>This reason is shown to the customer in their order history — be specific.</p>
      <textarea id="rejectReasonInput" placeholder="e.g. Kitchen closed early, item out of stock…"></textarea>
      <div class="modal-actions">
        <button class="btn ghost" id="rejectCancelBtn" type="button">Cancel</button>
        <button class="btn danger" id="rejectConfirmBtn" type="button">Reject order</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     CONFIG
     Adjust these two to match your actual deployment / login flow.
     ============================================================ */
  const API_BASE = 'https://eatswada.onrender.com/api/vendor';              
  const TOKEN_KEY      = 'nearbite_vendor_token';       // localStorage key set by your vendor login page
  const POLL_INTERVAL  = 15000;                          // live queue refresh, ms

  /* ============================================================
     STATE
     ============================================================ */
  const state = {
    activeTab: 'new',
    queue: [],          // placed / confirmed / preparing / out_for_delivery
    history: [],        // delivered / cancelled
    historyLoaded: false,
    restaurant: null,
    pollTimer: null,
    pendingRejectOrderId: null,
  };

  /* ============================================================
     DOM REFS
     ============================================================ */
  const el = {
    restaurantName: document.getElementById('restaurantName'),
    statusToggle:   document.getElementById('statusToggle'),
    ticketRail:     document.getElementById('ticketRail'),
    tabs:           Array.from(document.querySelectorAll('.tab')),
    countNew:       document.getElementById('countNew'),
    countPreparing: document.getElementById('countPreparing'),
    countDispatch:  document.getElementById('countDispatch'),
    lastUpdated:    document.getElementById('lastUpdated'),
    refreshBtn:     document.getElementById('refreshBtn'),
    toastStack:     document.getElementById('toastStack'),
    rejectModal:    document.getElementById('rejectModal'),
    rejectReasonInput: document.getElementById('rejectReasonInput'),
    rejectCancelBtn:   document.getElementById('rejectCancelBtn'),
    rejectConfirmBtn:  document.getElementById('rejectConfirmBtn'),
  };

  /* ============================================================
     API HELPERS
     ============================================================ */
  async function apiFetch(path, options) {
    const token = localStorage.getItem(TOKEN_KEY);
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: 'Bearer ' + token } : {}),
        ...(options && options.headers ? options.headers : {}),
      },
    });

    let body = null;
    try { body = await res.json(); } catch (_) { /* no body */ }

    if (res.status === 401) {
      showToast('error', 'Your session expired. Please log in again.');
      throw new Error('unauthorized');
    }
    if (!res.ok) {
      throw new Error((body && body.message) || 'Something went wrong. Please try again.');
    }
    return body;
  }

  /* ============================================================
     TOASTS
     ============================================================ */
  function showToast(type, message) {
    const toast = document.createElement('div');
    toast.className = 'toast' + (type === 'success' ? '' : ' ' + type);
    toast.textContent = message;
    el.toastStack.appendChild(toast);
    setTimeout(() => toast.remove(), 3800);
  }

  /* ============================================================
     TIME / FORMAT HELPERS
     ============================================================ */
  function timeAgo(dateStr) {
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.max(0, Math.round(diffMs / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    return hrs + 'h ' + (mins % 60) + 'm ago';
  }

  function formatMoney(n) {
    return '₹' + Number(n || 0).toLocaleString('en-IN');
  }

  /* ============================================================
     RENDER — TICKET CARD
     ============================================================ */
  function renderTicket(order) {
    const el = document.createElement('article');
    el.className = 'ticket status-' + order.status;
    el.dataset.id = order._id;

    const itemsToShow = order.items.slice(0, 4);
    const extra = order.items.length - itemsToShow.length;

    const itemsHtml = itemsToShow.map(i =>
      `<li><span class="qty">${i.quantity}×</span><span>${escapeHtml(i.name)}</span></li>`
    ).join('') + (extra > 0 ? `<li class="more">+${extra} more item${extra > 1 ? 's' : ''}</li>` : '');

    let footHtml = '';

    if (order.status === 'placed') {
      footHtml = `
        <div class="ticket-actions">
          <button class="btn reject" data-action="reject">Reject</button>
          <button class="btn accept" data-action="accept">Accept</button>
        </div>`;
    } else if (order.status === 'confirmed') {
      footHtml = `<button class="btn advance" data-action="advance">Start preparing</button>`;
    } else if (order.status === 'preparing') {
      footHtml = `<button class="btn advance" data-action="advance">Mark out for delivery</button>`;
    } else if (order.status === 'out_for_delivery') {
      footHtml = `<span class="badge dispatch">With delivery partner</span>`;
    } else if (order.status === 'delivered') {
      footHtml = `<span class="badge delivered">Delivered</span>`;
    } else if (order.status === 'cancelled') {
      footHtml = `<span class="badge cancelled">Cancelled</span>`;
    }

    el.innerHTML = `
      <header class="ticket-head">
        <span class="ticket-no">#${escapeHtml(order.orderNumber || order._id.slice(-6).toUpperCase())}</span>
        <span class="ticket-time">${timeAgo(order.createdAt)}</span>
      </header>
      <ul class="ticket-items">${itemsHtml}</ul>
      <footer class="ticket-foot">
        <span class="ticket-total">${formatMoney(order.total)}</span>
        ${footHtml}
      </footer>
      ${order.status === 'cancelled' && order.cancelReason
        ? `<p class="ticket-note">Reason: ${escapeHtml(order.cancelReason)}</p>` : ''}
    `;

    return el;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str == null ? '' : str);
    return div.innerHTML;
  }

  /* ============================================================
     RENDER — EMPTY / TAB SWITCH
     ============================================================ */
  const EMPTY_COPY = {
    new:       ['No new orders yet', 'They\u2019ll land here the moment someone places one.'],
    preparing: ['Nothing in the kitchen', 'Accepted orders waiting to go out will show up here.'],
    dispatch:  ['No orders out for delivery', 'Orders move here once they\u2019re handed to a delivery partner.'],
    history:   ['No past orders', 'Delivered and cancelled orders will appear here.'],
  };

  function renderEmpty(tab) {
    const [title, body] = EMPTY_COPY[tab];
    const div = document.createElement('div');
    div.className = 'state-panel';
    div.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 3"/>
      </svg>
      <h3>${title}</h3>
      <p>${body}</p>`;
    return div;
  }

  function ordersForTab(tab) {
    if (tab === 'new')        return state.queue.filter(o => o.status === 'placed');
    if (tab === 'preparing')  return state.queue.filter(o => o.status === 'confirmed' || o.status === 'preparing');
    if (tab === 'dispatch')   return state.queue.filter(o => o.status === 'out_for_delivery');
    if (tab === 'history')    return state.history;
    return [];
  }

  function renderActiveTab() {
    const orders = ordersForTab(state.activeTab);
    el.ticketRail.innerHTML = '';

    if (!orders.length) {
      el.ticketRail.appendChild(renderEmpty(state.activeTab));
      return;
    }
    orders.forEach(order => el.ticketRail.appendChild(renderTicket(order)));
  }

  function renderSkeleton() {
    el.ticketRail.innerHTML =
      '<div class="skeleton-ticket"></div><div class="skeleton-ticket"></div><div class="skeleton-ticket"></div>';
  }

  function updateCounts() {
    el.countNew.textContent       = state.queue.filter(o => o.status === 'placed').length;
    el.countPreparing.textContent = state.queue.filter(o => o.status === 'confirmed' || o.status === 'preparing').length;
    el.countDispatch.textContent  = state.queue.filter(o => o.status === 'out_for_delivery').length;
  }

  /* ============================================================
     DATA LOADING
     ============================================================ */
  async function loadRestaurant() {
    try {
      const res = await apiFetch('/restaurant');
      state.restaurant = res.data;
      el.restaurantName.textContent = state.restaurant.name || 'Your restaurant';
      setStatusToggle(state.restaurant.isActive);
      el.statusToggle.disabled = false;
    } catch (err) {
      el.restaurantName.textContent = 'Restaurant';
      showToast('error', err.message);
    }
  }

  async function loadQueue(isFirstLoad) {
    try {
      if (isFirstLoad) renderSkeleton();
      const res = await apiFetch('/orders?view=queue');
      state.queue = res.data;
      updateCounts();
      if (state.activeTab !== 'history') renderActiveTab();
      el.lastUpdated.textContent = 'Updated ' + timeAgo(new Date().toISOString());
    } catch (err) {
      if (isFirstLoad) {
        el.ticketRail.innerHTML = '';
        el.ticketRail.appendChild(renderEmpty(state.activeTab));
      }
      showToast('error', err.message);
    }
  }

  async function loadHistory() {
    try {
      renderSkeleton();
      const res = await apiFetch('/orders?view=history');
      state.history = res.data;
      state.historyLoaded = true;
      renderActiveTab();
    } catch (err) {
      showToast('error', err.message);
    }
  }

  /* ============================================================
     ORDER ACTIONS
     ============================================================ */
  async function acceptOrder(id, btn) {
    btn.disabled = true;
    try {
      await apiFetch('/orders/' + id + '/accept', { method: 'PUT' });
      showToast('success', 'Order accepted');
      await loadQueue(false);
    } catch (err) {
      showToast('error', err.message);
      btn.disabled = false;
    }
  }

  function openRejectModal(id) {
    state.pendingRejectOrderId = id;
    el.rejectReasonInput.value = '';
    el.rejectModal.classList.add('open');
    el.rejectReasonInput.focus();
  }

  function closeRejectModal() {
    state.pendingRejectOrderId = null;
    el.rejectModal.classList.remove('open');
  }

  async function confirmReject() {
    const reason = el.rejectReasonInput.value.trim();
    if (!reason) {
      el.rejectReasonInput.focus();
      return;
    }
    const id = state.pendingRejectOrderId;
    el.rejectConfirmBtn.disabled = true;
    try {
      await apiFetch('/orders/' + id + '/reject', {
        method: 'PUT',
        body: JSON.stringify({ reason }),
      });
      showToast('info', 'Order rejected');
      closeRejectModal();
      await loadQueue(false);
    } catch (err) {
      showToast('error', err.message);
    } finally {
      el.rejectConfirmBtn.disabled = false;
    }
  }

  async function advanceOrder(id, btn) {
    btn.disabled = true;
    try {
      await apiFetch('/orders/' + id + '/status', { method: 'PUT' });
      showToast('success', 'Order updated');
      await loadQueue(false);
    } catch (err) {
      showToast('error', err.message);
      btn.disabled = false;
    }
  }

  /* ============================================================
     RESTAURANT OPEN / CLOSE TOGGLE
     ============================================================ */
  function setStatusToggle(isActive) {
    el.statusToggle.classList.toggle('open', !!isActive);
    el.statusToggle.classList.toggle('closed', !isActive);
    el.statusToggle.querySelector('.label').textContent = isActive ? 'Open' : 'Closed';
  }

  async function toggleRestaurantStatus() {
    if (!state.restaurant) return;
    const nextValue = !state.restaurant.isActive;
    el.statusToggle.classList.add('busy');
    el.statusToggle.disabled = true;
    try {
      const res = await apiFetch('/status', {
        method: 'PUT',
        body: JSON.stringify({ isActive: nextValue }),
      });
      state.restaurant = res.data;
      setStatusToggle(state.restaurant.isActive);
      showToast('success', state.restaurant.isActive ? 'Restaurant is now open' : 'Restaurant is now closed');
    } catch (err) {
      showToast('error', err.message);
    } finally {
      el.statusToggle.classList.remove('busy');
      el.statusToggle.disabled = false;
    }
  }

  /* ============================================================
     EVENT WIRING
     ============================================================ */
  el.ticketRail.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const ticket = btn.closest('.ticket');
    const id = ticket.dataset.id;
    const action = btn.dataset.action;

    if (action === 'accept')  acceptOrder(id, btn);
    if (action === 'reject')  openRejectModal(id);
    if (action === 'advance') advanceOrder(id, btn);
  });

  el.tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      el.tabs.forEach(t => t.setAttribute('aria-selected', 'false'));
      tab.setAttribute('aria-selected', 'true');
      state.activeTab = tab.dataset.tab;

      if (state.activeTab === 'history') {
        loadHistory();
      } else {
        renderActiveTab();
      }
    });
  });

  el.statusToggle.addEventListener('click', toggleRestaurantStatus);
  el.refreshBtn.addEventListener('click', () => loadQueue(false));
  el.rejectCancelBtn.addEventListener('click', closeRejectModal);
  el.rejectConfirmBtn.addEventListener('click', confirmReject);
  el.rejectModal.addEventListener('click', (e) => {
    if (e.target === el.rejectModal) closeRejectModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && el.rejectModal.classList.contains('open')) closeRejectModal();
  });

  /* ============================================================
     POLLING — pauses while tab is hidden to save battery/data
     ============================================================ */
  function startPolling() {
    stopPolling();
    state.pollTimer = setInterval(() => {
      if (document.hidden) return;
      loadQueue(false);
    }, POLL_INTERVAL);
  }
  function stopPolling() {
    if (state.pollTimer) clearInterval(state.pollTimer);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadQueue(false);
  });

  /* ============================================================
     INIT
     ============================================================ */
  async function init() {
    await Promise.all([loadRestaurant(), loadQueue(true)]);
    startPolling();
  }

  init();
})();
</script>
</body>
  </html>
