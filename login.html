<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#D71945">
<title>Sign in · Eatswada Vendor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<style>
:root{--brand:#D71945;--brand-dark:#B3123A;--ink:#1C1C1C;--ink-soft:#5E6068;--page:#F4F4F6;--line:#E3E4E9;--danger:#C8283A;--danger-soft:#FDECEE;--ok:#18A06A;--font:'Manrope',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{position:relative;min-height:100vh;display:flex;justify-content:center;padding:0 16px;font-family:var(--font);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
body::before{content:"";position:absolute;inset:0 0 auto;height:310px;border-radius:0 0 32px 32px;background:linear-gradient(160deg,#E8264F 0%,var(--brand) 45%,#A50F33 100%)}
button{font-family:inherit}
:focus-visible{outline:3px solid rgba(215,25,69,.3);outline-offset:2px}
.auth-shell{position:relative;z-index:1;width:100%;max-width:400px;padding:56px 0 32px}
.brand{margin:0 4px 28px;color:#fff}
.brand-eyebrow{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;font-weight:800}
.brand h1{margin:16px 0 8px;font-size:30px;line-height:1.15;letter-spacing:-.8px;font-weight:800}
.brand p{margin:0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.88)}
.auth-card{padding:24px 20px 22px;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(30,10,20,.18)}
.field{margin-bottom:18px}
.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}
.field input{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:600 15px var(--font);transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:#A3A6AF;font-weight:500}
.field input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(215,25,69,.12)}
.field.has-error input{border-color:var(--danger)}
.field-error{display:none;margin-top:6px;font-size:12px;font-weight:600;color:var(--danger)}
.field.has-error .field-error{display:block}
.password-wrap{position:relative}
.password-wrap input{padding-right:48px}
.toggle-pw{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;padding:10px;border:0;background:none;color:var(--ink-soft);cursor:pointer}
.toggle-pw svg{width:20px;height:20px}
.form-banner{display:none;margin-bottom:16px;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:600;line-height:1.45}
.form-banner.show{display:block}
.btn-submit{width:100%;height:54px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(215,25,69,.28);transition:transform .08s,background .15s}
.btn-submit:hover{background:var(--brand-dark)}
.btn-submit:active{transform:scale(.98)}
.btn-submit:disabled{opacity:.7;cursor:wait;transform:none}
.spinner{width:16px;height:16px;flex:none;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
fieldset{border:0;padding:0;margin:0}
fieldset:disabled{opacity:.75}
.session-check-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff}
.session-check-overlay.hidden{display:none}
.session-check-overlay .brand-eyebrow{background:var(--page);color:var(--brand)}
.big-spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
.toast-stack{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column-reverse;gap:8px;width:min(92vw,380px)}
.toast{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;border-left:4px solid var(--ok);box-shadow:0 10px 25px rgba(0,0,0,.2);animation:tin .2s ease}
.toast.error{border-left-color:#FF5C70}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.offline-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:100;padding:10px 12px;background:var(--danger);color:#fff;text-align:center;font-size:12px;font-weight:700}
.offline-banner.show{display:block}
@media (prefers-reduced-motion:reduce){.spinner,.big-spinner,.toast{animation:none}}
</style>
</head>
<body>
  <div class="offline-banner" id="offlineBanner" role="status" aria-live="polite">You're offline. Check your internet connection and try again.</div>

  <div class="session-check-overlay" id="sessionCheckOverlay">
    <span class="brand-eyebrow">Eatswada Vendor</span>
    <div class="big-spinner"></div>
  </div>

  <div class="auth-shell">
          <div class="brand">
        <span class="brand-eyebrow">Eatswada Vendor</span>
        <h1>Sign in to your kitchen</h1>
        <p>Manage orders, menu and your restaurant from here.</p>
      </div>
    <div class="auth-card">

      <div class="form-banner" id="formBanner"></div>

      <form id="loginForm" novalidate>
        <fieldset id="formFieldset">
          <div class="field" id="emailField">
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" autocomplete="username" placeholder="you@restaurant.com" />
            <span class="field-error" id="emailError">Enter a valid email address.</span>
          </div>

          <div class="field" id="passwordField">
            <label for="passwordInput">Password</label>
            <div class="password-wrap">
              <input type="password" id="passwordInput" autocomplete="current-password" placeholder="••••••••" />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError">Enter your password.</span>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span id="submitLabel">Sign in</span>
          </button>
        </fieldset>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

<script src="./config.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     CONFIG — centralized in ./config.js (single Render↔AWS switch)
     ============================================================ */
  const CFG       = window.EATSWADA_CONFIG;
  const API_BASE  = CFG.API_BASE;  // resource routes — used here only to verify an existing token
  const AUTH_BASE = CFG.AUTH_BASE; // vendor login
  const TOKEN_KEY = CFG.TOKEN_KEY;

  /* ============================================================
     DOM REFS
     ============================================================ */
  const el = {
    overlay:      document.getElementById('sessionCheckOverlay'),
    offlineBanner: document.getElementById('offlineBanner'),
    form:         document.getElementById('loginForm'),
    fieldset:     document.getElementById('formFieldset'),
    emailField:   document.getElementById('emailField'),
    emailInput:   document.getElementById('emailInput'),
    emailError:   document.getElementById('emailError'),
    passwordField:   document.getElementById('passwordField'),
    passwordInput:   document.getElementById('passwordInput'),
    passwordError:   document.getElementById('passwordError'),
    togglePw:     document.getElementById('togglePw'),
    eyeIcon:      document.getElementById('eyeIcon'),
    submitBtn:    document.getElementById('submitBtn'),
    submitLabel:  document.getElementById('submitLabel'),
    formBanner:   document.getElementById('formBanner'),
    toastStack:   document.getElementById('toastStack'),
  };

  const EYE_OPEN   = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  const EYE_CLOSED = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

  /* ============================================================
     TOASTS
     ============================================================ */
  function showToast(type, message) {
    const toast = document.createElement('div');
    toast.className = 'toast' + (type === 'success' ? '' : ' ' + type);
    toast.textContent = message;
    el.toastStack.appendChild(toast);
    setTimeout(() => toast.remove(), 4200);
  }

  function showBanner(message) {
    el.formBanner.textContent = message;
    el.formBanner.classList.add('show');
  }
  function clearBanner() {
    el.formBanner.textContent = '';
    el.formBanner.classList.remove('show');
  }

  function updateNetworkUi() { el.offlineBanner.classList.toggle('show', !navigator.onLine); }
  window.addEventListener('online', updateNetworkUi);
  window.addEventListener('offline', updateNetworkUi);
  updateNetworkUi();

  /* ============================================================
     VALIDATION
     ============================================================ */
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setFieldError(fieldEl, hasError) {
    fieldEl.classList.toggle('has-error', hasError);
  }

  function validate() {
    let valid = true;
    const email = el.emailInput.value.trim();
    const password = el.passwordInput.value;

    const emailOk = EMAIL_RE.test(email);
    setFieldError(el.emailField, !emailOk);
    if (!emailOk) valid = false;

    const passwordOk = password.length > 0;
    setFieldError(el.passwordField, !passwordOk);
    if (!passwordOk) valid = false;

    return valid;
  }

  el.emailInput.addEventListener('input', () => setFieldError(el.emailField, false));
  el.passwordInput.addEventListener('input', () => setFieldError(el.passwordField, false));

  /* ============================================================
     PASSWORD VISIBILITY TOGGLE
     ============================================================ */
  let pwVisible = false;
  el.togglePw.addEventListener('click', () => {
    pwVisible = !pwVisible;
    el.passwordInput.type = pwVisible ? 'text' : 'password';
    el.eyeIcon.innerHTML = pwVisible ? EYE_CLOSED : EYE_OPEN;
    el.togglePw.setAttribute('aria-label', pwVisible ? 'Hide password' : 'Show password');
  });

  /* ============================================================
     LOADING STATE
     ============================================================ */
  function setLoading(isLoading) {
    el.fieldset.disabled = isLoading;
    el.submitBtn.disabled = isLoading;
    el.submitLabel.textContent = isLoading ? 'Signing in…' : 'Sign in';
    if (isLoading) {
      if (!el.submitBtn.querySelector('.spinner')) {
        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        el.submitBtn.prepend(spinner);
      }
    } else {
      const spinner = el.submitBtn.querySelector('.spinner');
      if (spinner) spinner.remove();
    }
  }

  /* ============================================================
     LOGIN SUBMIT
     ============================================================ */
  el.form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearBanner();

    if (!validate()) {
      (el.emailField.classList.contains('has-error') ? el.emailInput : el.passwordInput).focus();
      return;
    }

    setLoading(true);

    if (!navigator.onLine) {
      setLoading(false);
      showBanner('You appear to be offline. Reconnect to the internet and try again.');
      return;
    }

    let res, body;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      res = await fetch(AUTH_BASE + '/vendor/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ email: el.emailInput.value.trim(), password: el.passwordInput.value }),
        signal: controller.signal,
      });
    } catch (networkErr) {
      setLoading(false);
      showBanner(networkErr.name === 'AbortError' ? 'The server took too long to respond. Please try again.' : 'Can’t reach the server. Check your connection and try again.');
      return;
    } finally {
      clearTimeout(timeout);
    }

    try {
      body = await res.json();
    } catch (parseErr) {
      body = null;
    }

    if (!res.ok || !body || !body.success) {
      setLoading(false);
      showBanner((body && body.message) || 'Something went wrong. Please try again.');
      return;
    }

    // Success — persist session and hand off to the dashboard.
    localStorage.setItem(TOKEN_KEY, body.token);
    if (body.user)       localStorage.setItem('nearbite_vendor_user', JSON.stringify(body.user));
    if (body.restaurant) localStorage.setItem('nearbite_vendor_restaurant', JSON.stringify(body.restaurant));

    window.location.href = 'index.html';
  });

  /* ============================================================
     EXISTING SESSION CHECK
     Verifies a stored token is still valid by calling an already-
     protected resource route, rather than trusting localStorage blindly.
     ============================================================ */
  async function checkExistingSession() {
    const token = localStorage.getItem(TOKEN_KEY);
    const reason = new URLSearchParams(location.search).get('reason');
    if (reason === 'session_expired') showBanner('Your session expired. Please sign in again.');
    if (!token) { el.overlay.classList.add('hidden'); return; }

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    try {
      const res = await fetch(API_BASE + '/restaurant', {
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
        signal: controller.signal,
      });
      if (res.ok) { window.location.replace('index.html'); return; }
      if (res.status === 401 || res.status === 403) localStorage.removeItem(TOKEN_KEY);
    } catch (_) {
      // Never trap the vendor behind the session overlay.
    } finally {
      clearTimeout(timeout);
    }
    el.overlay.classList.add('hidden');
  }

  checkExistingSession();
})();
</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }</script>
<div style="position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:13px;color:var(--ink-soft,#5B5F72);">New restaurant? <a href="apply.html" style="color:var(--green,#159A62);font-weight:700;text-decoration:none;">Apply to become a vendor</a> · <a href="application-status.html" style="color:var(--green,#159A62);font-weight:700;text-decoration:none;">Check application</a></div>
</body>
</html>
