<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Application status · Eatswada</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet"><style>:root{--ink:#1A1D29;--muted:#667085;--paper:#F2F3F6;--card:#fff;--line:#E3E5EA;--primary:#E4572E}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}main{max-width:560px;margin:0 auto;padding:32px 16px}.brand{margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{font-family:Poppins;font-size:26px;margin:5px 0}p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(26,29,41,.05)}label{display:block;font-size:13px;font-weight:600;margin:0 0 7px}input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{margin-top:10px;border:0;border-radius:10px;padding:11px 16px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}.result{margin-top:18px}.status{padding:12px;border-radius:10px;background:#f6f7f9}.pending{border-left:4px solid #c97a11}.approved{border-left:4px solid #2f6f4e}.rejected{border-left:4px solid #9c3b3b}.mono{font-family:monospace;word-break:break-all}.links{margin-top:16px;font-size:13px}.links a{color:#c43f1b;font-weight:600;margin-right:14px}</style></head><body><main><div class="brand"><div class="eyebrow">Eatswada Partner</div><h1>Application status</h1><p>Check your restaurant application without logging in.</p></div><section class="card"><label for="id">Application ID</label><input id="id" placeholder="Paste application ID"><label for="token" style="margin-top:14px">Status token</label><input id="token" placeholder="Paste your status token"><button class="btn" id="check">Check status</button><div class="result" id="result"></div></section><div class="links"><a href="apply.html">Become a vendor</a><a href="login.html">Vendor login</a></div></main><script>const API='https://eatswada.onrender.com/api/vendor-applications';const id=document.getElementById('id'),token=document.getElementById('token'),result=document.getElementById('result');const savedId=sessionStorage.getItem('eatswada_vendor_application_id'),savedToken=sessionStorage.getItem('eatswada_vendor_application_status_token');if(savedId)id.value=savedId;if(savedToken)token.value=savedToken;document.getElementById('check').onclick=async()=>{const a=id.value.trim(),t=token.value.trim();if(!a||!t){result.innerHTML='<div class="status rejected">Application ID and status token are required.</div>';return}result.innerHTML='<p>Checking…</p>';try{const r=await fetch(API+'/'+encodeURIComponent(a)+'/status?statusToken='+encodeURIComponent(t),{headers:{Accept:'application/json'}});const j=await r.json().catch(()=>null);if(!r.ok||!j?.success)throw new Error(j?.message||'Could not check status.');const x=j.data;const cls=x.status==='approved'?'approved':x.status==='rejected'?'rejected':'pending';result.innerHTML='<div class="status '+cls+'"><strong>'+x.status.toUpperCase()+'</strong><div style="margin-top:8px">'+x.restaurantName+'</div>'+(x.rejectionReason?'<div style="margin-top:8px">Reason: '+x.rejectionReason.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</div>':'')+'</div>'}catch(e){result.innerHTML='<div class="status rejected">'+e.message+'</div>'}}</script></body></html>
