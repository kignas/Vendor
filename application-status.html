<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Application status · Eatswada</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet"><style>:root{--ink:#1A1D29;--muted:#667085;--paper:#F2F3F6;--card:#fff;--line:#E3E5EA;--primary:#E4572E}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}main{max-width:560px;margin:0 auto;padding:32px 16px}.brand{margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{font-family:Poppins;font-size:26px;margin:5px 0}p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(26,29,41,.05)}label{display:block;font-size:13px;font-weight:600;margin:0 0 7px}input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{margin-top:10px;border:0;border-radius:10px;padding:11px 16px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}.result{margin-top:18px}.status{padding:12px;border-radius:10px;background:#f6f7f9}.pending{border-left:4px solid #c97a11}.approved{border-left:4px solid #2f6f4e}.rejected{border-left:4px solid #9c3b3b}.mono{font-family:monospace;word-break:break-all}.links{margin-top:16px;font-size:13px}.links a{color:#c43f1b;font-weight:600;margin-right:14px}</style>\n<style>\n  :root{--ink:#1C2024;--muted:#697077;--paper:#F5F7F8;--card:#fff;--line:#E7EAED;--green:#159A62;--green-ink:#0F7A4D;--green-soft:#E6F4EC;--red:#C63A2F;--red-soft:#FBEAE8;--amber:#D97706;--amber-soft:#FEF3C7}\n  html{background:var(--paper)}\n  body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% -8%,rgba(21,154,98,.09),transparent 34%),linear-gradient(180deg,#F8FAF9,var(--paper));-webkit-font-smoothing:antialiased}\n  main{max-width:600px;padding:34px 16px 64px}\n  .brand{padding:4px 2px 0;margin-bottom:24px}\n  .eyebrow{color:var(--green);font-weight:800;letter-spacing:.13em}\n  h1{font-family:'Manrope',sans-serif;font-size:29px;letter-spacing:-.7px;margin:7px 0 6px}\n  .brand p{font-size:13px;line-height:1.55}\n  .card{border:1px solid rgba(231,234,237,.96);border-radius:22px;padding:26px;box-shadow:0 2px 5px rgba(28,32,36,.035),0 18px 50px rgba(28,32,36,.075);position:relative;overflow:hidden}\n  .card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--green),#34B77F,var(--green))}\n  label{font-weight:800;color:#30363B}\n  input{min-height:48px;border:1px solid #DDE2E5;border-radius:12px;background:#FAFBFB;padding:12px 13px;transition:border-color .16s,box-shadow .16s,background .16s}\n  input:hover{border-color:#C9D2CD}\n  input:focus{background:#fff;outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(21,154,98,.10)}\n  .btn{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:13px;background:linear-gradient(180deg,#1AA66B,#159A62);color:#fff;font-family:'Manrope',sans-serif;font-weight:800;box-shadow:0 7px 18px rgba(21,154,98,.20);transition:transform .14s,box-shadow .14s}\n  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(21,154,98,.25)}\n  .btn:active{transform:translateY(0)}\n  .result{margin-top:18px}\n  .status{padding:15px;border-radius:14px;border:1px solid var(--line);background:#FBFCFC;box-shadow:0 4px 14px rgba(28,32,36,.045);line-height:1.5}\n  .pending{border-left:4px solid var(--amber);background:var(--amber-soft)}\n  .approved{border-left:4px solid var(--green);background:var(--green-soft)}\n  .rejected{border-left:4px solid var(--red);background:var(--red-soft)}\n  .links{margin-top:18px;text-align:center;line-height:1.8}\n  .links a{color:var(--green-ink);font-weight:800}\n  :focus-visible{outline:3px solid rgba(21,154,98,.22);outline-offset:2px}\n  @media(max-width:520px){main{padding:22px 12px 54px}.card{padding:21px 16px;border-radius:19px}h1{font-size:25px}}\n  @media(prefers-reduced-motion:reduce){input,.btn{transition:none!important}}\n</style>\n</head><body><main><div class="brand"><div class="eyebrow">Eatswada Partner</div><h1>Application status</h1><p>Check your restaurant application without logging in.</p></div><section class="card"><label for="id">Application ID</label><input id="id" placeholder="Paste application ID"><label for="token" style="margin-top:14px">Status token</label><input id="token" placeholder="Paste your status token"><button class="btn" id="check">Check status</button><div class="result" id="result"></div></section><div class="links"><a href="apply.html">Become a vendor</a><a href="login.html">Vendor login</a></div></main><script>const API='https://eatswada.onrender.com/api/vendor-applications';const id=document.getElementById('id'),token=document.getElementById('token'),result=document.getElementById('result');const savedId=sessionStorage.getItem('eatswada_vendor_application_id'),savedToken=sessionStorage.getItem('eatswada_vendor_application_status_token');if(savedId)id.value=savedId;if(savedToken)token.value=savedToken;document.getElementById('check').onclick=async()=>{const a=id.value.trim(),t=token.value.trim();if(!a||!t){result.innerHTML='<div class="status rejected">Application ID and status token are required.</div>';return}result.innerHTML='<p>Checking…</p>';try{const r=await fetch(API+'/'+encodeURIComponent(a)+'/status?statusToken='+encodeURIComponent(t),{headers:{Accept:'application/json'}});const j=await r.json().catch(()=>null);if(!r.ok||!j?.success)throw new Error(j?.message||'Could not check status.');const x=j.data;const cls=x.status==='approved'?'approved':x.status==='rejected'?'rejected':'pending';result.innerHTML='<div class="status '+cls+'"><strong>'+x.status.toUpperCase()+'</strong><div style="margin-top:8px">'+x.restaurantName+'</div>'+(x.rejectionReason?'<div style="margin-top:8px">Reason: '+x.rejectionReason.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</div>':'')+'</div>'}catch(e){result.innerHTML='<div class="status rejected">'+e.message+'</div>'}}</script></body></html>
