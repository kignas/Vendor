<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Application status · Eatswada</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet"><style>:root{--ink:#1A1D29;--muted:#667085;--paper:#F2F3F6;--card:#fff;--line:#E3E5EA;--primary:#E4572E}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif}main{max-width:560px;margin:0 auto;padding:32px 16px}.brand{margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{font-family:Poppins;font-size:26px;margin:5px 0}p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(26,29,41,.05)}label{display:block;font-size:13px;font-weight:600;margin:0 0 7px}input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{margin-top:10px;border:0;border-radius:10px;padding:11px 16px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}.result{margin-top:18px}.status{padding:12px;border-radius:10px;background:#f6f7f9}.pending{border-left:4px solid #c97a11}.approved{border-left:4px solid #2f6f4e}.rejected{border-left:4px solid #9c3b3b}.mono{font-family:monospace;word-break:break-all}.links{margin-top:16px;font-size:13px}.links a{color:#c43f1b;font-weight:600;margin-right:14px}</style>
<style>
  :root{--ink:#1C2024;--muted:#697077;--paper:#F5F7F8;--card:#fff;--line:#E7EAED;--green:#159A62;--green-ink:#0F7A4D;--green-soft:#E6F4EC;--red:#C63A2F;--red-soft:#FBEAE8;--amber:#D97706;--amber-soft:#FEF3C7}
  html{background:var(--paper)}
  body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% -8%,rgba(21,154,98,.09),transparent 34%),linear-gradient(180deg,#F8FAF9,var(--paper));-webkit-font-smoothing:antialiased}
  main{max-width:600px;padding:34px 16px 64px}
  .brand{padding:4px 2px 0;margin-bottom:24px}
  .eyebrow{color:var(--green);font-weight:800;letter-spacing:.13em}
  h1{font-family:'Manrope',sans-serif;font-size:29px;letter-spacing:-.7px;margin:7px 0 6px}
  .brand p{font-size:13px;line-height:1.55}
  .card{border:1px solid rgba(231,234,237,.96);border-radius:22px;padding:26px;box-shadow:0 2px 5px rgba(28,32,36,.035),0 18px 50px rgba(28,32,36,.075);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--green),#34B77F,var(--green))}
  label{font-weight:800;color:#30363B}
  input{min-height:48px;border:1px solid #DDE2E5;border-radius:12px;background:#FAFBFB;padding:12px 13px;transition:border-color .16s,box-shadow .16s,background .16s}
  input:hover{border-color:#C9D2CD}
  input:focus{background:#fff;outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(21,154,98,.10)}
  .btn{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:13px;background:linear-gradient(180deg,#1AA66B,#159A62);color:#fff;font-family:'Manrope',sans-serif;font-weight:800;box-shadow:0 7px 18px rgba(21,154,98,.20);transition:transform .14s,box-shadow .14s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(21,154,98,.25)}
  .btn:active{transform:translateY(0)}
  .result{margin-top:18px}
  .status{padding:15px;border-radius:14px;border:1px solid var(--line);background:#FBFCFC;box-shadow:0 4px 14px rgba(28,32,36,.045);line-height:1.5}
  .pending{border-left:4px solid var(--amber);background:var(--amber-soft)}
  .approved{border-left:4px solid var(--green);background:var(--green-soft)}
  .rejected{border-left:4px solid var(--red);background:var(--red-soft)}
  .links{margin-top:18px;text-align:center;line-height:1.8}
  .links a{color:var(--green-ink);font-weight:800}
  :focus-visible{outline:3px solid rgba(21,154,98,.22);outline-offset:2px}
  @media(max-width:520px){main{padding:22px 12px 54px}.card{padding:21px 16px;border-radius:19px}h1{font-size:25px}}
  @media(prefers-reduced-motion:reduce){input,.btn{transition:none!important}}
</style>
</head><body><main><div class="brand"><div class="eyebrow">Eatswada Partner</div><h1>Application status</h1><p>Check your restaurant application without logging in.</p></div><section class="card"><label for="id">Application ID</label><input id="id" placeholder="Paste application ID"><label for="token" style="margin-top:14px">Status token</label><input id="token" placeholder="Paste your status token"><button class="btn" id="check">Check status</button><div class="result" id="result"></div></section><div class="links"><a href="apply.html">Become a vendor</a><a href="login.html">Vendor login</a></div></main><script src="./config.js"></script>
<script>
(function () {
  'use strict';
  var API = window.EATSWADA_CONFIG.APPLICATIONS_BASE;
  // Only statuses the backend actually returns are rendered; unknown values fall through safely.
  var STATUS_LABEL = {
    draft: 'DRAFT', submitted: 'SUBMITTED', under_review: 'UNDER REVIEW',
    pending: 'PENDING REVIEW', more_information_required: 'MORE INFORMATION REQUIRED',
    approved: 'APPROVED', rejected: 'REJECTED'
  };
  var idEl = document.getElementById('id');
  var tokenEl = document.getElementById('token');
  var result = document.getElementById('result');
  var btn = document.getElementById('check');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var LS_ID = 'eatswada_vendor_application_id';
  var LS_TOKEN = 'eatswada_vendor_application_status_token';
  function readStore(key) {
    try { var a = sessionStorage.getItem(key); if (a) return a; } catch (e) {}
    try { var b = localStorage.getItem(key); if (b) return b; } catch (e) {}
    return '';
  }
  function persist(a, t) {
    try { sessionStorage.setItem(LS_ID, a); sessionStorage.setItem(LS_TOKEN, t); } catch (e) {}
    try { localStorage.setItem(LS_ID, a); localStorage.setItem(LS_TOKEN, t); } catch (e) {}
  }
  function fmtDate(s) { try { return new Date(s).toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function pretty(s) { return String(s || '').replace(/_/g, ' '); }
  function nextSteps(key) {
    if (key === 'more_information_required') return 'The Eatswada team needs changes before they can approve your restaurant. Edit your application below — it resubmits under the same application ID.';
    if (key === 'rejected') return 'This application was not approved. You can update your details and resubmit for another review.';
    if (key === 'approved') return 'Your restaurant is approved. <a href="login.html" style="color:var(--green-ink);font-weight:800">Sign in to your vendor dashboard</a>.';
    if (key === 'pending' || key === 'submitted' || key === 'under_review' || key === 'draft') return 'Your application is with the Eatswada review team. No action is needed right now.';
    return 'Contact the Eatswada team if you need help with this application.';
  }
  var params = new URLSearchParams(location.search);
  var savedId = params.get('id') || readStore(LS_ID);
  var savedToken = params.get('token') || readStore(LS_TOKEN);
  if (savedId) idEl.value = savedId;
  if (savedToken) tokenEl.value = savedToken;
  function statusClass(s) { return s === 'approved' ? 'approved' : s === 'rejected' ? 'rejected' : 'pending'; }
  async function check() {
    var a = idEl.value.trim(), t = tokenEl.value.trim();
    if (!a || !t) { result.innerHTML = '<div class="status rejected">Application ID and status token are required.</div>'; return; }
    btn.disabled = true;
    result.innerHTML = '<p>Checking…</p>';
    try {
      var r = await fetch(API + '/' + encodeURIComponent(a) + '/status?statusToken=' + encodeURIComponent(t), { headers: { Accept: 'application/json' } });
      var j = await r.json().catch(function () { return null; });
      if (!r.ok || !j || !j.success) throw new Error((j && j.message) || 'Could not check status.');
      persist(a, t);
      var x = j.data || {};
      var key = String(x.status || 'pending').toLowerCase();
      var label = STATUS_LABEL[key] || key.replace(/_/g, ' ').toUpperCase();
      var html = '<div class="status ' + statusClass(key) + '"><strong>' + esc(label) + '</strong>';
      if (x.restaurantName) html += '<div style="margin-top:8px;font-weight:600">' + esc(x.restaurantName) + '</div>';
      if (x.ownerName) html += '<div style="margin-top:4px;color:var(--muted)">Owner: ' + esc(x.ownerName) + '</div>';
      if (x.createdAt) html += '<div style="margin-top:4px;color:var(--muted)">Submitted: ' + esc(fmtDate(x.createdAt)) + '</div>';
      var meta = [pretty(x.businessType), pretty(x.deliveryMode)].filter(Boolean).join(' · ');
      if (meta) html += '<div style="margin-top:4px;color:var(--muted)">' + esc(meta) + '</div>';
      if (x.changeRequest) html += '<div style="margin-top:12px;padding:12px;border-radius:10px;background:var(--amber-soft,#FEF3C7);line-height:1.5"><strong>Message from the Eatswada team</strong><div style="margin-top:6px">' + esc(x.changeRequest) + '</div></div>';
      if (x.rejectionReason) html += '<div style="margin-top:12px"><strong>Reason:</strong> ' + esc(x.rejectionReason) + '</div>';
      html += '<div style="margin-top:12px;line-height:1.5;color:var(--muted)">' + nextSteps(key) + '</div>';
      if (key === 'more_information_required' || key === 'rejected') {
        // The token is kept out of the URL: it was just persisted to storage above,
        // so apply.html reads it from there instead of exposing it in history/referrer.
        html += '<div style="margin-top:14px"><a class="btn" style="display:inline-block;width:auto;padding:12px 18px;text-decoration:none" href="apply.html?edit=1&id=' + encodeURIComponent(a) + '">Edit &amp; resubmit application</a></div>';
      }
      html += '</div>';
      result.innerHTML = html;
    } catch (e) {
      result.innerHTML = '<div class="status rejected">' + esc(e.message || 'Could not check status.') + '</div>';
    } finally { btn.disabled = false; }
  }
  btn.addEventListener('click', check);
  [idEl, tokenEl].forEach(function (n) { n.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); });
  if (savedId && savedToken) check();
})();
</script></body></html>
